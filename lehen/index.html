<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ZAIN · Abendualdia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* ============================================================
   ZAIN — Abendualdiko egutegia · LEHEN HEZKUNTZA
   Lehen Hezkuntza osorako egutegi bakarra, bi hizkuntzatan (EUS / CAS), goian.
   Helbidean ere aukeratu daiteke: ?lang=es.
   Proiektorerako diseinatua (16:9). Probatzeko: ?proba (ate guztiak
   irekita) edo ?gaur=2026-12-16 (egun jakin bat simulatu).
   Ate bakoitza irekitzean, asteko izarraren punta bat pizten da.
   ============================================================ */
:root{
  --paper:#FFF8EE; --card:#FFFFFF; --ink:#23264A; --mute:#5C5F84; --line:#EBDDC6;
  --violet:#5A3BC0; --violet-dark:#42299A; --violet-soft:#EFEAFD;
  --candle:#6A4BC4; --rose:#E27AAE; --flame:#FFB238;
  --star:#FFC83A; --star-line:#DE9C00; --star-center:#FFE08A;
  --star-off:#F4ECDD; --star-off-line:#D3C3A5;
  /* Ostiralak: La Salle horia. Itxita daudenean tonu argiagoa. */
  --friday:#FFCD00; --friday-line:#E0B400; --friday-ink:#5A3D00;
  --friday-locked:#FFE680; --friday-locked-ink:#5A3D00;
  --locked:#F3EBDD; --locked-ink:#67637E; --gap-line:#C6B89E;
  --night:#1B1F45; --night-line:#353A72; --night-mute:#C8CBEA;
  --erronka:#A3381A; --erronka-soft:#FFE4D8;
  --familia:#1D6B48; --familia-soft:#DBF2E5;
  --display:'Baloo 2', Nunito, system-ui, sans-serif;
  --body:Nunito, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(12px, min(1.25vw, 2.22vh), 28px)}
body{margin:0;background:var(--paper) radial-gradient(circle at 88% -8%, rgba(255,200,58,.22), transparent 30rem) no-repeat;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}

/* ---------- Egutegia ---------- */
.kutxa{min-height:100vh;height:100vh;padding:2rem 3.5rem 1.4rem;display:flex;flex-direction:column;gap:1.4rem}
.goiburua{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem}
.izenburua{display:flex;flex-direction:column;gap:.35rem}
.izenburua p{margin:0}
.aurrea{font-size:.95rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font-family:var(--display);font-size:6.2rem;font-weight:800;line-height:.86;letter-spacing:-.01em;display:flex;align-items:flex-start;gap:.08em}
.h1-izarra{display:inline-flex;width:.42em;height:.42em;margin-top:.02em}
.h1-izarra svg{width:100%;height:100%;fill:var(--star);stroke:var(--star-line);stroke-width:1.6;stroke-linejoin:round}
.leloa{font-size:1.3rem;font-weight:700;color:var(--mute)}
.koroa{display:flex;flex-direction:column;align-items:center;gap:.55rem}
.kandelak{display:flex;align-items:flex-end;gap:1.3rem}
.kandela{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem}
.eraztuna{position:absolute;top:-.6rem;left:50%;width:2.6rem;height:2.6rem;margin-left:-1.3rem;border:2px solid var(--flame);border-radius:50%;opacity:0;pointer-events:none}
.sugarra{width:.9rem;height:1.4rem;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;background:var(--flame)}
.sugarra.itzalia{background:transparent}
.gorputza{width:1.25rem;height:4rem;border-radius:6px;background:var(--candle)}
.gorputza.arrosa{background:var(--rose)}
.gorputza.itzalia{opacity:.4}
.koroa p{margin:0;font-size:.9rem;font-weight:700;color:var(--mute)}

.sareta-bilgarria{flex:1;min-height:0;overflow-x:auto}
.sareta{height:100%;min-width:56rem;display:grid;grid-template-columns:13.5rem repeat(5,minmax(0,1fr));grid-template-rows:auto repeat(4,minmax(4.8rem,1fr));gap:.8rem}
.astegun{align-self:end;font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.astea{display:flex;align-items:center;gap:.75rem;padding-right:.3rem}
.astea .izarra{width:3.9rem;height:3.9rem;flex:none}
.astea-testua{display:flex;flex-direction:column;gap:.05rem;min-width:0}
.astea-testua span:first-child{font-size:.85rem;font-weight:800;color:var(--mute)}
.astea-testua span:last-child{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.05}
.astea.oraingoa .astea-testua span:last-child{color:var(--violet)}

/* Asteko izarra: bost punta, bost egun */
.izarra{overflow:visible}
.izarra path{stroke-width:3.4;stroke-linejoin:round}
.izarra .punta,.izarra .erdia{fill:var(--star-off);stroke:var(--star-off-line)}
.izarra .punta.piztua{fill:var(--star);stroke:var(--star-line)}
.izarra.osoa .erdia{fill:var(--star-center);stroke:var(--star-line)}
.izarra.osoa{filter:drop-shadow(0 0 .4rem rgba(255,186,30,.6))}

.gela{position:relative;height:100%;padding:.65rem .85rem;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:0;overflow:hidden}
.gela .data{font-size:.85rem;font-weight:700;padding-right:2.6rem}
.gela .izena{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.05}
.gela .zenbakia{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:1}
.gela .ikurra{position:absolute;top:.55rem;right:.6rem;width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet)}
.gela .ikurra svg{width:1.35rem;height:1.35rem}
button.gela{cursor:pointer}
.irekia{background:var(--card);border:2px solid var(--line)}
.irekia .data{color:var(--mute)}
.ostirala{background:var(--friday);border:2px solid var(--friday-line)}
.ostirala .data{color:var(--friday-ink)}
.ostirala .ikurra{background:rgba(255,255,255,.65);color:var(--friday-ink)}
.itxia{background:var(--locked);color:var(--locked-ink)}
.itxia svg{align-self:flex-end;width:1.25rem;height:1.25rem;opacity:.75}
.itxia.ostirala{background:var(--friday-locked);border:2px solid var(--friday-line);color:var(--friday-locked-ink)}
.gaur{background:var(--violet);color:#FFFFFF;box-shadow:0 10px 24px -12px rgba(90,59,192,.6)}
.gaur:hover{background:var(--violet-dark)}
.gaur .data{letter-spacing:.06em;text-transform:uppercase;padding-right:0}
.gaur .izena{display:flex;align-items:center;justify-content:space-between;font-size:1.45rem}
.hutsunea{border:2px dashed var(--gap-line);color:var(--mute)}
.hutsunea .izena{font-family:var(--body);font-size:1rem;font-weight:700}
.gabonak{background:var(--night);color:#FFFFFF}
.gabonak .izena{display:flex;align-items:center;gap:.5rem}
.gabonak .izena svg{color:var(--star);fill:var(--star)}
.gabonak .data{color:var(--night-mute)}
.jaia{background:transparent;border:2px dashed var(--gap-line)}
.jaia .data{color:var(--mute)}
.jaia:hover{border-style:solid;border-color:var(--violet);background:var(--card)}
button.irekia:hover,button.ostirala:hover{border-color:var(--violet)}

.oina{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.9rem;font-weight:600;color:var(--mute)}
.oina p{margin:0}
.oina-ezkerra{display:flex;align-items:center;gap:1.1rem}
.logoa{display:block;height:2.3rem;width:auto;opacity:.92}
.oina-ezkerra p{padding-left:1.1rem;border-left:2px solid var(--line)}
.oina-eskuina{display:flex;align-items:center;gap:.75rem}
.botoi-txikia{min-height:44px;padding:0 1.1rem;border:2px solid var(--line);border-radius:999px;background:transparent;color:var(--mute);font-weight:700;cursor:pointer}
.botoi-txikia:hover{border-color:var(--violet);color:var(--violet)}
.oharra{display:inline-flex;align-items:center;gap:1rem;color:var(--violet);font-weight:700}
.oharra[hidden]{display:none}
.ate-zero{border-color:var(--violet);color:var(--violet)}
.ate-zero:hover{background:var(--violet);color:#FFFFFF}

/* ---------- Aukerak: hizkuntza ---------- */
.goiburu-eskuina{display:flex;flex-direction:column;align-items:flex-end;gap:.9rem}
.aukerak{display:flex;align-items:center;gap:.7rem}
.txanda{display:inline-flex;padding:3px;border:2px solid var(--violet);border-radius:999px;background:var(--card)}
.txanda button{min-height:38px;min-width:4rem;padding:0 .95rem;border:0;border-radius:999px;background:transparent;color:var(--violet);font-family:var(--display);font-size:1.02rem;font-weight:800;letter-spacing:.04em;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.txanda button[aria-pressed="true"]{background:var(--violet);color:#FFFFFF;cursor:default}
.txanda button[aria-pressed="false"]:hover{background:var(--violet-soft)}
.atea-eskuina{display:flex;align-items:center;gap:1.1rem}
.atea.gaua .txanda{background:transparent;border-color:var(--night-line)}
.atea.gaua .txanda button{color:var(--night-mute)}
.atea.gaua .txanda button[aria-pressed="true"]{background:var(--flame);color:var(--night)}
.atea.gaua .txanda button[aria-pressed="false"]:hover{background:#2A2F63}


/* ---------- Ate irekia ---------- */
.atea{position:fixed;inset:0;padding:2.1rem 4.5rem 2.3rem;display:flex;flex-direction:column;justify-content:space-between;gap:1.2rem;background:var(--paper);overflow:auto}
.atea[hidden]{display:none}
.atea-goia{display:flex;justify-content:space-between;align-items:center;gap:1.5rem}
.atzera{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:0 1.15rem 0 .85rem;border:2px solid var(--violet-soft);border-radius:999px;background:var(--card);font-size:1.06rem;font-weight:800;color:var(--violet);cursor:pointer}
.atzera:hover{border-color:var(--violet)}
.meta{margin:0;font-size:1.06rem;font-weight:700;color:var(--mute)}
.testua{display:flex;flex-direction:column;gap:.95rem;max-width:68rem}
.testua p{margin:0}
.ate-izenburua{display:flex;align-items:center;gap:1.1rem;margin:0}
.ikur-handia{width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;background:var(--violet);color:#FFFFFF;flex:none}
.ikur-handia svg{width:2.5rem;height:2.5rem}
.ate-izena{font-family:var(--display);font-size:calc(3.2rem * var(--eskala,1));font-weight:800;line-height:1}
.esaldia{font-size:calc(2.8rem * var(--eskala,1));font-weight:700;line-height:1.22}
.esaldia.luzea{font-size:calc(2.35rem * var(--eskala,1));line-height:1.24}
.esaldia.oso-luzea{font-size:calc(2rem * var(--eskala,1));line-height:1.28}
.esaldia.luzeena{font-size:calc(1.85rem * var(--eskala,1));line-height:1.3}
.iturria{font-size:1.2rem;font-weight:700;color:var(--mute)}
.ardatza{display:flex;flex-direction:column;gap:.25rem;padding:.35rem 0 .4rem 1.1rem;border-left:6px solid var(--star);max-width:64rem}
.ardatza-burua{font-size:calc(.85rem * var(--eskala,1));font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7A5200}
.ardatza p{margin:0;font-size:calc(1.45rem * var(--eskala,1));font-weight:700;font-style:italic;line-height:1.28;text-wrap:pretty}
.ardatza-iturria{margin-left:.6rem;font-size:.8em;font-style:normal;color:var(--mute);white-space:nowrap}
.galdera{display:flex;align-items:center;justify-content:space-between;gap:2rem;padding:1.15rem 1.7rem 1.35rem;border-radius:24px;background:var(--card);border:3px solid var(--violet-soft);max-width:68rem}
.galdera-barrua{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem}
.galdera p{margin:0;font-family:var(--display);font-size:calc(2.2rem * var(--eskala,1));font-weight:700;line-height:1.12}
.txipa{display:inline-flex;align-items:center;padding:.2rem .85rem;border-radius:999px;font-size:.88rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--violet-soft);color:var(--violet)}
.galdera.erronka{border-color:var(--erronka-soft)}
.galdera.erronka .txipa{background:var(--erronka-soft);color:var(--erronka)}
.galdera.familian{border-color:var(--familia-soft)}
.galdera.familian .txipa{background:var(--familia-soft);color:var(--familia)}
.izar-lerroa{display:flex;gap:.9rem;flex:none}
.izar-lerroa .izarra{width:4.2rem;height:4.2rem}
.atea-behea{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem}
.segurtasuna{margin:0;font-size:1.12rem;font-weight:600;color:var(--mute);max-width:36rem}
.kontagailua{display:flex;align-items:center;gap:1.4rem}
.denbora{font-family:var(--display);font-size:3.8rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hasi{min-height:3.4rem;padding:0 1.7rem;border:0;border-radius:999px;background:var(--violet);color:#FFFFFF;font-size:1.2rem;font-weight:800;cursor:pointer}
.hasi:hover{background:var(--violet-dark)}
.hasi,.egoera{white-space:nowrap}
.egoera{font-size:1.25rem;font-weight:700;color:var(--mute)}
.egoera.amaitua{color:var(--violet)}

/* Keinua */
.keinu-burua{font-family:var(--display);font-size:calc(2.3rem * var(--eskala,1));font-weight:700;line-height:1.12;margin:0}
.urratsak{list-style:none;counter-reset:u;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem;max-width:64rem}
.urratsak li{counter-increment:u;display:flex;gap:1rem;align-items:flex-start;font-size:calc(1.8rem * var(--eskala,1));font-weight:700;line-height:1.25}
.urratsak li::before{content:counter(u);flex:none;width:2.5rem;height:2.5rem;margin-top:-.05rem;border-radius:50%;display:grid;place-items:center;background:var(--star);color:#3D2A00;font-family:var(--display);font-size:1.35rem;font-weight:800}


/* Ostiraleko kandela: pantaila iluna, kandela erdian */
.atea.gaua{background:var(--night);color:#FFFFFF}
.atea.gaua .atzera{background:transparent;border-color:var(--night-line);color:var(--night-mute)}
.atea.gaua .atzera:hover{color:#FFFFFF;border-color:var(--night-mute)}
.atea.gaua .meta{color:var(--night-mute)}
.atea.gaua :focus-visible{outline-color:var(--flame)}
.gau-erdia{flex:1;display:flex;align-items:center;justify-content:center;gap:6rem}
.kandela-handia{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.kandela-handia .sugarra{width:2.9rem;height:4.6rem;animation:dardara 2.4s ease-in-out infinite;transform-origin:50% 100%}
.kandela-handia .metxa{width:4px;height:.6rem;background:#0F1230}
.kandela-handia .gorputza{width:4.6rem;height:14rem;border-radius:12px;background:#7A5AD6}
.kandela-handia .oinarria{width:8.75rem;height:1rem;border-radius:999px;background:#0F1230}
.gau-testua{display:flex;flex-direction:column;gap:1.15rem;max-width:36rem}
.gau-testua p{margin:0}
.gau-testua .handia{font-family:var(--display);font-size:3.6rem;font-weight:800;line-height:1}
.gau-testua .erdikoa{font-size:1.6rem;font-weight:600;line-height:1.35}
.gau-testua .itzala{color:var(--night-mute)}
.gau-testua .gau-galdera{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.15;color:#FFFFFF;text-wrap:balance}
.gau-testua .kontagailua{padding-top:1.15rem;border-top:2px solid var(--night-line)}
.atea.gaua .hasi{background:var(--flame);color:var(--night)}
.atea.gaua .hasi:hover{background:#FFC870}
.atea.gaua .egoera{color:var(--night-mute)}
.atea.gaua .egoera.amaitua{color:var(--flame)}
@keyframes dardara{0%,100%{transform:scale(1,1)}50%{transform:scale(.94,1.06)}}
@media (prefers-reduced-motion: reduce){.kandela-handia .sugarra{animation:none}}

@media (max-width: 760px){
  .kutxa{height:auto;padding:1.5rem}
  .goiburua{flex-direction:column;align-items:flex-start}
  .goiburu-eskuina{align-items:flex-start}
  .aukerak{flex-wrap:wrap}
  .atea-goia,.atea-eskuina{flex-wrap:wrap}
  .atea{padding:1.5rem}
  .atea-behea,.galdera{flex-direction:column;align-items:flex-start}
  .gau-erdia{flex-direction:column;gap:2rem}
}

/* ---------- Tipografia fina ---------- */
.ate-izena,.esaldia,.galdera p,.keinu-burua,.gau-testua .handia{text-wrap:balance}
.urratsak li,.iturria,.segurtasuna{text-wrap:pretty}
.esaldia{hanging-punctuation:first}
.gela .data,.denbora{font-variant-numeric:tabular-nums}

/* ---------- Isilunea ---------- */
.atea-goia,.atea .testua,.segurtasuna,.atea .txipa,.atea .izar-lerroa{transition:opacity 1.2s ease}
.atea.isilean .atea-goia,.atea.isilean .testua,.atea.isilean .segurtasuna,.atea.isilean .txipa,.atea.isilean .izar-lerroa{opacity:.28}
.aurrerapena{position:fixed;left:0;right:0;bottom:0;height:8px;background:var(--star);transform-origin:left center;transform:scaleX(1);transition:opacity .8s ease}
.atea.gaua .aurrerapena{background:var(--flame)}
.egoera{transition:color .6s ease}

/* ---------- Mugimendua ---------- */
::view-transition-group(ate){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.75,.15,1)}
::view-transition-old(ate),::view-transition-new(ate){animation-duration:.35s;height:100%;object-fit:cover}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}

@media (prefers-reduced-motion: no-preference){
  .goiburua{animation:agertu .7s cubic-bezier(.2,.75,.15,1) both}
  .sareta.lehena > *{animation:agertu .6s cubic-bezier(.2,.75,.15,1) both;animation-delay:calc(.15s + var(--i,0) * 28ms)}
  .h1-izarra svg{animation:dirdira 3.2s ease-in-out infinite;transform-origin:50% 55%}
  .kandela .sugarra:not(.itzalia){transform-origin:50% 100%;animation:dardara 3.4s ease-in-out infinite;animation-delay:calc(var(--k,0) * 600ms)}
  .koroa .kandela.berria .gorputza{animation:argitu .6s ease .8s both}
  .koroa .kandela.berria .sugarra{animation:sortu 1s cubic-bezier(.3,1.5,.5,1) 1.3s both,dardara 3.4s ease-in-out 2.4s infinite}
  .koroa .kandela.berria .eraztuna{animation:eraztuna 1.3s ease-out 1.45s both}
  .koroa.berria #igandea{animation:agertu .7s cubic-bezier(.2,.75,.15,1) 2s both}
  button.gela{transition:transform .25s cubic-bezier(.2,.75,.15,1),box-shadow .25s ease,border-color .25s ease,background-color .25s ease}
  button.gela.irekia:hover,button.gela.ostirala:hover,button.gela.jaia:hover,button.gela.gabonak:hover{transform:translateY(-3px) rotate(-.6deg);box-shadow:0 12px 24px -14px rgba(35,38,74,.35)}
  button.gela.gaur{animation:taupada 2.6s ease-out infinite}
  .sareta.lehena > button.gela.gaur{animation:agertu .6s cubic-bezier(.2,.75,.15,1) calc(.15s + var(--i,0) * 28ms) both,taupada 2.6s ease-out 1.4s infinite}
  button.gela.gaur:hover{transform:translateY(-3px)}
  button.gela:active{transform:translateY(0) scale(.985)}
  .gaur .izena svg{animation:bultza 2.6s ease-in-out infinite}
  .izarra .punta.berria{transform-box:fill-box;transform-origin:center;animation:puntaPiztu .9s cubic-bezier(.3,1.6,.5,1) .55s both}
  .izarra.berria-du{animation:izarDir 1.1s ease .5s both}
  .izarra.osatu-berria{animation:izarOsatu 1.5s cubic-bezier(.3,1.3,.5,1) 1.25s both}
  .izarra.osatu-berria .erdia{animation:erdiaPiztu .6s ease 1.4s both}
  .atea .sarrera{animation:agertu .7s cubic-bezier(.2,.75,.15,1) both;animation-delay:calc(.2s + var(--i,0) * 130ms)}
  .atea .ikur-handia{animation:jauzi .8s cubic-bezier(.3,1.6,.5,1) .35s both}
  .atea.gaua{animation:itzali 1.4s ease both}
  .atea.gaua .kandela-handia .sugarra{animation:piztu .9s ease-out 1.1s both,dardara 2.4s ease-in-out 2s infinite}
  .atea.gaua .gau-testua p{animation:agertu .8s cubic-bezier(.2,.75,.15,1) both}
  .atea.gaua .gau-testua p:nth-child(1){animation-delay:.6s}

function ikonoa(izena){
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('width', '1.25em'); s.setAttribute('height', '1.25em'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = IKONOAK[izena] || IKONOAK.izarra;
  return s;
}

/* ============================================================
   LOGIKA
   ============================================================ */
// Helbidean '?' bat baino gehiago badago (adib. ?lang=es?proba), '&' bihurtu.
if (location.search.indexOf('?', 1) > -1) {
  try { history.replaceState(null, '', location.pathname + '?' + location.search.slice(1).replace(/\?/g, '&') + location.hash); } catch (e) {}
}
const P = new URLSearchParams(location.search.slice(1).replace(/\?/g, '&'));
const PROBA = P.has('proba');
const GAUR = dataZuzena(P.get('gaur')) ? P.get('gaur') : gaurIso();
// Proba-moduetan (?proba edo ?gaur) ez da ate irekirik gordetzen: benetako egunean dena berri agertzeko.
const SIMULAZIOA = PROBA || P.has('gaur');

// Hizkuntza: ?lang=es / ?lang=eu helbidean, bestela ordenagailu honetan azken aukera, bestela euskara.
function hasierakoHizkuntza(){
  const p = (P.get('lang') || '').toLowerCase();
  if (['es', 'cas'].includes(p)) return 'es';
  if (['eu', 'eus'].includes(p)) return 'eu';
  try { const g = localStorage.getItem('zain-hizkuntza'); if (g === 'eu' || g === 'es') return g; } catch (e) {}
  return 'eu';
}
let HIZK = hasierakoHizkuntza();
// Lehen bi mailako bertsioen arrastoak garbitu (?maila=… esteka zaharrek funtzionatzen jarraitzen dute).
try { localStorage.removeItem('zain-lh-maila'); } catch (e) {}
if (P.has('maila')) helbidea('maila', null);
function T(){ return TESTUAK[HIZK]; }

function dataZuzena(s){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(y, m - 1, d);
  return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d;
}
function gaurIso(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function data(iso){ const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function hilabetea(iso){ return T().hilabeteak[data(iso).getMonth()]; }
function egunLuzea(iso){ const d = data(iso); return T().egunLuzea(T().astegunak[d.getDay()], hilabetea(iso), d.getDate()); }
function egunLaburra(iso){ return T().egunLaburra(hilabetea(iso), data(iso).getDate()); }
function asteaNon(iso){ const a = ASTEAK.find(x => x.egunak.includes(iso)); return a && HIZK === 'es' ? a.es : a; }
// Atea, uneko hizkuntzan: euskarazkoa, eta gaztelaniaz, gainean ATEAK_ES.
function atea(iso){
  return Object.assign({}, ATEAK[iso], HIZK === 'es' ? (ATEAK_ES[iso] || {}) : {});
}

let irekiak = new Set();
try { irekiak = new Set(JSON.parse(localStorage.getItem('zain-lh-irekiak') || '[]')); } catch (e) { irekiak = new Set(); }
function gorde(iso){
  irekiak.add(iso);
  if (SIMULAZIOA) return;
  try { localStorage.setItem('zain-lh-irekiak', JSON.stringify([...irekiak])); } catch (e) {}
}

function el(tag, klasea, testua){
  const e = document.createElement(tag);
  if (klasea) e.className = klasea;
  if (testua != null) e.textContent = testua;
  return e;
}

/* ---------- Asteko izarra: bost punta, bost egun ---------- */
const IZAR = (() => {
  const R = 46, r = 20, cx = 50, cy = 54.4;
  const p = (ang, rad) => (cx + rad * Math.cos(ang * Math.PI / 180)).toFixed(2) + ' ' + (cy + rad * Math.sin(ang * Math.PI / 180)).toFixed(2);
  const kanpo = k => p(-90 + 72 * k, R);
  const barru = k => p(-54 + 72 * k, r);
  const zenbak = [0, 1, 2, 3, 4];
  return {
    // Puntak erlojuaren norabidean, goikotik hasita: astelehena, asteartea, asteazkena, osteguna, ostirala.
    puntak: zenbak.map(k => 'M' + barru(k - 1) + ' L' + kanpo(k) + ' L' + barru(k) + ' Z'),
    erdia: 'M' + zenbak.map(barru).join(' L') + ' Z'
  };
})();
function puntaPiztua(iso){ return PROBA || iso < GAUR || (iso === GAUR && irekiak.has(iso)); }
function izarra(astea, berria){
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('viewBox', '0 0 100 100'); s.setAttribute('class', 'izarra'); s.setAttribute('role', 'img');
  const erdia = document.createElementNS(ns, 'path');
  erdia.setAttribute('d', IZAR.erdia); erdia.setAttribute('class', 'erdia');
  s.appendChild(erdia);
  let piztuak = 0;
  astea.egunak.forEach((iso, k) => {
    const piztua = puntaPiztua(iso);
    if (piztua) piztuak++;
    const punta = document.createElementNS(ns, 'path');
    punta.setAttribute('d', IZAR.puntak[k]);
    punta.setAttribute('class', 'punta' + (piztua ? ' piztua' : '') + (iso === berria ? ' berria' : ''));
    s.appendChild(punta);
  });
  if (piztuak === 5) s.classList.add('osoa');
  if (berria && astea.egunak.includes(berria)) s.classList.add(piztuak === 5 ? 'osatu-berria' : 'berria-du');
  s.setAttribute('aria-label', T().izarra((HIZK === 'es' ? astea.es : astea).zenb, piztuak));
  return s;
}
function izarLerroa(asteak){
  const d = el('div', 'izar-lerroa');
  asteak.forEach(a => d.appendChild(izarra(a)));
  return d;
}

/* ---------- Aukerak: hizkuntza (EUS / CAS) ---------- */
function txanda(klasea, etiketa, aukerak, unekoa, aldatu){
  const g = el('div', 'txanda ' + klasea);
  g.setAttribute('role', 'group');
  g.setAttribute('aria-label', etiketa);
  aukerak.forEach(([kodea, laburra, osoa, lang]) => {
    const b = el('button', null, laburra);
    b.type = 'button'; b.title = osoa; b.dataset.kodea = kodea;
    if (lang) b.lang = lang;
    b.setAttribute('aria-label', osoa);
    b.setAttribute('aria-pressed', String(kodea === unekoa));
    b.addEventListener('click', () => aldatu(kodea));
    g.appendChild(b);
  });
  return g;
}
function hizkuntzaAukera(){
  return txanda('hizkuntza', 'Hizkuntza · Idioma', [['eu', 'EUS', 'Euskara', 'eu'], ['es', 'CAS', 'Castellano', 'es']], HIZK, hizkuntzaAldatu);
}
function aukerak(){
  const d = el('div', 'aukerak');
  d.appendChild(hizkuntzaAukera());
  return d;
}

// Helbideko parametro bat aldatu (beste guztiak, ?proba edo ?gaur adibidez, bere horretan utzita).
function helbidea(izena, balioa){
  try {
    const zatiak = location.search.replace(/^\?/, '').split('&').filter(z => z && z.split('=')[0] !== izena);
    if (balioa) zatiak.push(izena + '=' + balioa);
    history.replaceState(null, '', location.pathname + (zatiak.length ? '?' + zatiak.join('&') : '') + location.hash);
  } catch (e) {}
}

function denaBerritu(){
  if (erlojua) { clearInterval(erlojua); erlojua = null; }
  testuFinkoak();
  koroaTestua();
  oinaTestuak();
  document.getElementById('sareta').innerHTML = '';
  sareta();
  if (!PANTAILA.hidden) irekiBarrua(itzultzeko);
}
function fokuaItzuli(klasea, kodea){
  const lekua = PANTAILA.hidden ? document.getElementById('kutxa') : PANTAILA;
  const botoia = lekua.querySelector('.' + klasea + ' [data-kodea="' + kodea + '"]');
  if (botoia) botoia.focus({ preventScroll: true });
}

function hizkuntzaAldatu(kodea){
  if (kodea === HIZK) return;
  HIZK = kodea;
  try { localStorage.setItem('zain-hizkuntza', kodea); } catch (e) {}
  helbidea('lang', kodea === 'es' ? 'es' : null);
  denaBerritu();
  fokuaItzuli('hizkuntza', kodea);
}

function testuFinkoak(){
  document.documentElement.lang = HIZK;
  document.title = T().izenburua;
  document.querySelector('.aurrea').textContent = T().aurrea;
  document.querySelector('.leloa').textContent = T().leloa;
  document.getElementById('koroa').setAttribute('aria-label', T().koroa);
  const lekua = document.getElementById('aukerak-lekua');
  lekua.innerHTML = '';
  lekua.appendChild(aukerak());
}

/* ---------- Koroa ---------- */
const PIZTUAK = IGANDEAK.filter(ig => GAUR >= ig).length;
function koroa(){
  const lekua = document.getElementById('kandelak');
  IGANDEAK.forEach((ig, i) => {
    const piztua = i < PIZTUAK;
    const k = el('div', 'kandela');
    k.style.setProperty('--k', i);
    k.appendChild(el('div', 'sugarra' + (piztua ? '' : ' itzalia')));
    k.appendChild(el('div', 'gorputza' + (i === 2 ? ' arrosa' : '') + (piztua ? '' : ' itzalia')));
    lekua.appendChild(k);
  });
  // Aste berriko kandela: ordenagailu bakoitzean astean behin pizten da (?gaur-ekin beti).
  if (PIZTUAK > 0) {
    const igandea = IGANDEAK[PIZTUAK - 1];
    let pizteko = true;
    try {
      pizteko = SIMULAZIOA || localStorage.getItem('zain-lh-koroa') !== igandea;
      if (!SIMULAZIOA) localStorage.setItem('zain-lh-koroa', igandea);
    } catch (e) { pizteko = true; }
    if (pizteko) {
      const berria = lekua.children[PIZTUAK - 1];
      berria.classList.add('berria');
      berria.appendChild(el('div', 'eraztuna'));
      lekua.closest('.koroa').classList.add('berria');
    }
  }
  koroaTestua();
}
function koroaTestua(){
  const testua = document.getElementById('igandea');
  if (PIZTUAK === 0) testua.textContent = T().koroaAurretik;
  else testua.innerHTML = T().igandea(PIZTUAK) + (PIZTUAK === 3 ? ' · <em>Gaudete</em>' : '');
}

/* ---------- Egutegiaren sareta ---------- */
let lehenAldia = true;
let PIZTEKOA = null; // gaurko atea lehen aldiz ireki da: itzultzean, izarraren punta pizten da
function sareta(berria){
  const s = document.getElementById('sareta');
  s.classList.toggle('lehena', lehenAldia);
  lehenAldia = false;
  s.appendChild(el('span'));
  T().astegunak.slice(1, 6).forEach(a => s.appendChild(el('span', 'astegun', a)));

  ASTEAK.forEach(astea => {
    const oraingoa = astea.egunak[0] <= GAUR && GAUR <= astea.egunak[4];
    const izena = HIZK === 'es' ? astea.es : astea;
    const etiketa = el('div', 'astea' + (oraingoa ? ' oraingoa' : ''));
    etiketa.appendChild(izarra(astea, berria));
    const testua = el('div', 'astea-testua');
    testua.appendChild(el('span', null, izena.zenb));
    testua.appendChild(el('span', null, izena.gaia));
    etiketa.appendChild(testua);
    s.appendChild(etiketa);
    astea.egunak.forEach(iso => s.appendChild(gela(iso)));
  });
  [...s.children].forEach((c, i) => c.style.setProperty('--i', i));
  izenakDoitu();
}

/* Izen luzeak gelaxkan sartu: letra txikitu, gelaxkatik irten gabe (gutxienez % 62). */
function izenakDoitu(){
  document.querySelectorAll('#sareta .gela .izena').forEach(iz => {
    iz.style.fontSize = '';
    const g = iz.closest('.gela');
    let px = parseFloat(getComputedStyle(iz).fontSize);
    const min = px * 0.62;
    while ((g.scrollHeight > g.clientHeight + 1 || iz.scrollWidth > iz.clientWidth + 1) && px > min) {
      px -= 1; iz.style.fontSize = px + 'px';
    }
  });
}

/* Ate-pantaila: edukia ez bada sartzen, letrak pixkanaka txikitu (proiektorean, korritu gabe). */
function ateaDoitu(){
  if (PANTAILA.hidden) return;
  PANTAILA.style.removeProperty('--eskala');
  if (window.matchMedia('(max-width: 760px)').matches) return;
  let e = 1;
  while (PANTAILA.scrollHeight > PANTAILA.clientHeight + 1 && e > 0.7) {
    e = Math.round((e - 0.04) * 100) / 100;
    PANTAILA.style.setProperty('--eskala', e);
  }
}

let doituTenporizadorea = null;
window.addEventListener('resize', () => {
  clearTimeout(doituTenporizadorea);
  doituTenporizadorea = setTimeout(() => { izenakDoitu(); ateaDoitu(); }, 150);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { izenakDoitu(); ateaDoitu(); });

function ikurra(izena, klasea){
  const i = el('span', klasea || 'ikurra');
  i.appendChild(ikonoa(izena));
  return i;
}

function gela(iso){
  const a = atea(iso);
  const gabonak = iso === '2026-12-25';
  const ostirala = data(iso).getDay() === 5;
  let egoera;
  if (PROBA || iso < GAUR) egoera = 'irekia';
  else if (iso === GAUR) egoera = irekiak.has(iso) ? 'irekia' : 'gaur';
  else egoera = 'itxia';

  if (egoera === 'itxia') {
    if (gabonak) {
      const g = el('div', 'gela gabonak');
      g.appendChild(el('span', 'data', egunLaburra(iso)));
      const iz = el('span', 'izena'); iz.appendChild(ikonoa('izarra')); iz.appendChild(document.createTextNode(T().gabonak));
      g.appendChild(iz);
      return g;
    }
    if (a.jaia) {
      const g = el('div', 'gela hutsunea');
      g.appendChild(el('span', 'zenbakia', String(data(iso).getDate())));
      g.appendChild(el('span', 'izena', a.etiketa));
      return g;
    }
    const g = el('div', 'gela itxia' + (ostirala ? ' ostirala' : ''));
    g.appendChild(el('span', 'zenbakia', String(data(iso).getDate())));
    const i = ikonoa('giltzarrapoa'); i.setAttribute('aria-hidden', 'false'); i.setAttribute('role', 'img'); i.setAttribute('aria-label', T().itxita);
    g.appendChild(i);
    return g;
  }
  const b = el('button', 'gela');
  b.type = 'button';
  b.dataset.iso = iso;
  if (egoera === 'gaur') {
    b.classList.add('gaur');
    b.appendChild(el('span', 'data', T().gaur + ' · ' + data(iso).getDate()));
    const iz = el('span', 'izena', T().ireki); iz.appendChild(ikonoa('aurrera'));
    b.appendChild(iz);
  } else if (gabonak) {
    b.classList.add('gabonak');
    b.appendChild(el('span', 'data', egunLaburra(iso)));
    const iz = el('span', 'izena'); iz.appendChild(ikonoa('izarra')); iz.appendChild(document.createTextNode(T().gabonak));
    b.appendChild(iz);
  } else if (a.jaia) {
    b.classList.add('jaia');
    b.appendChild(el('span', 'data', egunLaburra(iso)));
    b.appendChild(ikurra(a.ikonoa));
    b.appendChild(el('span', 'izena', a.izena));
  } else {
    b.classList.add(ostirala ? 'ostirala' : 'irekia');
    b.appendChild(el('span', 'data', egunLaburra(iso)));
    b.appendChild(ikurra(a.ikonoa));
    b.appendChild(el('span', 'izena', a.izena));
  }
  b.addEventListener('click', () => ireki(iso));
  return b;
}

/* ---------- Kontagailua ---------- */
let erlojua = null;
function kontagailua(segundoak, ilundu){
  const k = el('div', 'kontagailua');
  const denbora = el('span', 'denbora', formatua(segundoak));
  const botoia = el('button', 'hasi', T().hasi); botoia.type = 'button';
  k.appendChild(denbora); k.appendChild(botoia);
  botoia.addEventListener('click', () => {
    let geratzen = segundoak;
    const egoera = el('span', 'egoera', ilundu ? T().begiakItxita : T().martxan);
    botoia.replaceWith(egoera);
    if (ilundu) PANTAILA.classList.add('isilean');
    const barra = el('div', 'aurrerapena');
    barra.setAttribute('aria-hidden', 'true');
    PANTAILA.appendChild(barra);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      barra.style.transition = 'transform ' + segundoak + 's linear, opacity .8s ease';
      barra.style.transform = 'scaleX(0)';
    }));
    erlojua = setInterval(() => {
      geratzen -= 1;
      denbora.textContent = formatua(Math.max(geratzen, 0));
      denbora.classList.remove('tik'); void denbora.offsetWidth; denbora.classList.add('tik');
      if (geratzen <= 0) {
        clearInterval(erlojua); erlojua = null;
        PANTAILA.classList.remove('isilean');
        barra.style.opacity = '0';
        egoera.textContent = T().amaitua; egoera.classList.add('amaitua');
      }
    }, 1000);
  });
  return k;
}
function formatua(s){ return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function isilunea(){ return EZARPENAK.isilunea; }

/* ---------- Atea ireki ---------- */
const PANTAILA = document.getElementById('atea');
let itzultzeko = null;

function mugimenduaBai(){
  return !!document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function izenakGarbitu(){
  document.querySelectorAll('.gela, #atea, [data-iso]').forEach(e => { e.style.viewTransitionName = ''; });
}
function trantsizioa(aldaketa, nondik, nora){
  // Aldaketa beti behin eta behin bakarrik gertatzen da, trantsizioak huts egin arren.
  let eginda = false;
  const egin = () => { if (!eginda) { eginda = true; aldaketa(); } };
  if (!mugimenduaBai()) { egin(); return; }
  try {
    if (nondik) nondik.style.viewTransitionName = 'ate';
    const t = document.startViewTransition(() => {
      if (nondik) nondik.style.viewTransitionName = '';
      egin();
      const helburua = nora();
      if (helburua) helburua.style.viewTransitionName = 'ate';
    });
    t.ready.catch(() => {});
    t.updateCallbackDone.catch(() => { izenakGarbitu(); egin(); });
    t.finished.catch(() => {}).finally(izenakGarbitu);
  } catch (e) {
    izenakGarbitu();
    egin();
  }
}

function ireki(iso){
  const nondik = document.querySelector('[data-iso="' + iso + '"]');
  trantsizioa(() => irekiBarrua(iso), nondik, () => PANTAILA);
}

function irekiBarrua(iso){
  itzultzeko = iso;
  if (iso !== '0' && iso === GAUR) {
    if (!irekiak.has(iso)) PIZTEKOA = iso;
    gorde(iso);
  }
  const a = atea(iso);
  PANTAILA.innerHTML = '';
  PANTAILA.className = 'atea' + (a.mota === 'kandela' ? ' gaua' : '');

  const goia = el('div', 'atea-goia');
  const atzera = el('button', 'atzera'); atzera.type = 'button';
  atzera.appendChild(ikonoa('atzera')); atzera.appendChild(document.createTextNode(T().kutxa));
  atzera.addEventListener('click', itxi);
  goia.appendChild(atzera);
  let meta;
  if (iso === '0') meta = T().zeroMeta;
  else {
    const astea = asteaNon(iso);
    meta = a.jaia ? egunLuzea(iso) + ' · ' + a.etiketa
      : a.mota === 'keinua' ? egunLuzea(iso) + ' · ' + T().keinua
      : egunLuzea(iso) + ' · ' + astea.zenb + ' · ' + astea.gaia;
  }
  const eskuina = el('div', 'atea-eskuina');
  eskuina.appendChild(el('p', 'meta', meta));
  eskuina.appendChild(aukerak());
  goia.appendChild(eskuina);
  PANTAILA.appendChild(goia);

  if (a.mota === 'testua') testuaMarraztu(a);
  else if (a.mota === 'kandela') kandelaMarraztu(a);
  else if (a.mota === 'keinua') keinuaMarraztu(a);

  [...PANTAILA.children].slice(1).forEach((c, i) => { c.classList.add('sarrera'); c.style.setProperty('--i', i); });
  PANTAILA.hidden = false;
  ateaDoitu();
  document.getElementById('kutxa').setAttribute('aria-hidden', 'true');
  atzera.focus({ preventScroll: true });
}

function izenburua(a){
  const h = el('h2', 'ate-izenburua');
  h.appendChild(ikurra(a.ikonoa, 'ikur-handia'));
  h.appendChild(el('span', 'ate-izena', a.izena));
  return h;
}
function esaldia(testua){
  const luzera = testua.length;
  return el('p', 'esaldia' + (luzera > 280 ? ' luzeena' : luzera > 230 ? ' oso-luzea' : luzera > 150 ? ' luzea' : ''), testua);
}
function galderaMota(a){ return a.erronka ? 'erronka' : a.familian ? 'familian' : 'galdera'; }
function galderaTxartela(a, gehigarria){
  const mota = galderaMota(a);
  const g = el('div', 'galdera ' + mota);
  const barrua = el('div', 'galdera-barrua');
  barrua.appendChild(el('span', 'txipa', T().etiketak[mota]));
  barrua.appendChild(el('p', null, a[mota]));
  g.appendChild(barrua);
  if (gehigarria) g.appendChild(gehigarria);
  return g;
}
function oharraTestua(a){
  if (a.jaia) return T().jaiOharra;
  const mota = galderaMota(a);
  if (mota === 'erronka') return T().erronkaOharra;
  if (mota === 'familian') return T().jaiOharra;
  return T().galderaOharra;
}

function testuaMarraztu(a){
  const t = el('div', 'testua');
  t.appendChild(izenburua(a));
  // Astelehenetan: asteko ardatza (igandeko ebanjelioa), erreferentziarekin.
  if (a.ardatza) {
    const ard = el('div', 'ardatza');
    ard.appendChild(el('span', 'ardatza-burua', T().ardatza));
    const p = el('p', null, a.ardatza);
    if (a.iturria) p.appendChild(el('span', 'ardatza-iturria', a.iturria));
    ard.appendChild(p);
    t.appendChild(ard);
  }
  t.appendChild(esaldia(a.testua));
  if (a.iturria && !a.ardatza) t.appendChild(el('p', 'iturria', a.iturria));
  PANTAILA.appendChild(t);
  PANTAILA.appendChild(galderaTxartela(a, a.izarrak ? izarLerroa(ASTEAK) : null));
  const behea = el('div', 'atea-behea');
  behea.appendChild(el('p', 'segurtasuna', oharraTestua(a)));
  behea.appendChild(kontagailua(isilunea(), true));
  PANTAILA.appendChild(behea);
}

function kandelaMarraztu(a){
  const erdia = el('div', 'gau-erdia');
  const k = el('div', 'kandela-handia'); k.setAttribute('aria-hidden', 'true');
  ['sugarra', 'metxa', 'gorputza', 'oinarria'].forEach(c => k.appendChild(el('div', c)));
  erdia.appendChild(k);
  const t = el('div', 'gau-testua');
  t.appendChild(el('p', 'handia', a.burua));
  t.appendChild(el('p', 'erdikoa itzala', a.testua));
  t.appendChild(el('p', 'erdikoa gau-galdera', a.galdera));
  t.appendChild(el('p', 'erdikoa itzala', a.oharra));
  t.appendChild(kontagailua(isilunea(), true));
  erdia.appendChild(t);
  PANTAILA.appendChild(erdia);
}

function keinuaMarraztu(a){
  const t = el('div', 'testua');
  t.appendChild(izenburua(a));
  t.appendChild(el('p', 'keinu-burua', a.burua));
  if (a.azalpena) t.appendChild(el('p', 'iturria', a.azalpena));
  const ol = el('ol', 'urratsak');
  a.urratsak.forEach(u => ol.appendChild(el('li', null, u)));
  t.appendChild(ol);
  PANTAILA.appendChild(t);
  const behea = el('div', 'atea-behea');
  behea.appendChild(el('p', 'segurtasuna', a.segurtasuna || ''));
  if (a.segundoak > 0) behea.appendChild(kontagailua(a.segundoak, false));
  PANTAILA.appendChild(behea);
}

function itxi(){
  if (erlojua) { clearInterval(erlojua); erlojua = null; }
  const helburua = () => document.querySelector('[data-iso="' + itzultzeko + '"]');
  trantsizioa(() => {
    PANTAILA.hidden = true;
    PANTAILA.innerHTML = '';
    PANTAILA.className = 'atea';
    document.getElementById('kutxa').removeAttribute('aria-hidden');
    document.getElementById('sareta').innerHTML = '';
    sareta(PIZTEKOA);
    PIZTEKOA = null;
    const berria = helburua() || document.querySelector('#sareta button.gela');
    if (berria) berria.focus({ preventScroll: true });
  }, PANTAILA, helburua);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !PANTAILA.hidden) itxi(); });

/* ---------- Oina eta abisuak ---------- */
function oina(){
  const pantaila = document.getElementById('pantaila');
  if (!document.documentElement.requestFullscreen) pantaila.hidden = true;
  pantaila.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener('fullscreenchange', oinaTestuak);
  oinaTestuak();
}
function oinaTestuak(){
  document.getElementById('gaurkoa').textContent = PROBA ? T().proba : T().gaur + ': ' + egunLuzea(GAUR);
  document.getElementById('pantaila').textContent = document.fullscreenElement ? T().pantailaIrten : T().pantailaOsoa;
  const oharra = document.getElementById('oharra');
  // 0. atea: azaroaren 30a baino lehen beti eskuragarri (eta proba-moduan ere).
  const aurretik = GAUR < '2026-11-30';
  if (PROBA || aurretik) {
    oharra.hidden = false;
    oharra.textContent = '';
    if (aurretik && !PROBA) oharra.appendChild(el('span', null, T().lehenAtea));
    const b = el('button', 'botoi-txikia ate-zero', T().zeroBotoia); b.type = 'button';
    b.dataset.iso = '0';
    b.addEventListener('click', () => ireki('0'));
    oharra.appendChild(b);
  }
}

testuFinkoak();
koroa();
sareta();
oina();

// Proiektorean egun osoa irekita uzten bada: gauerdia pasatzean, egutegia egun berrira eguneratu.
if (!SIMULAZIOA) {
  setInterval(() => {
    if (gaurIso() !== GAUR && PANTAILA.hidden) location.reload();
  }, 60000);
}
</script>
